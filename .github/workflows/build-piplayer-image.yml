name: Build PiPlayer Image

on:
  workflow_dispatch:

jobs:
  build-image:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          docker system prune -af || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync qemu-user-static binfmt-support debootstrap dosfstools xz-utils zip unzip libarchive-tools parted quilt

      - name: Enable QEMU binfmt
        run: |
          sudo update-binfmts --enable qemu-arm || true
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Build image
        id: build
        continue-on-error: true
        env:
          PIPLAYER_BUILD_MODE: direct
        run: |
          mkdir -p image-builder/work
          chmod +x image-builder/build-image.sh
          set -o pipefail
          image-builder/build-image.sh 2>&1 | tee image-builder/work/build.log

      - name: Show failure log tail
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed. Showing log tail:"
          tail -n 250 image-builder/work/build.log || true
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: piplayer-build-log
          path: image-builder/work/build.log

      - name: Upload image artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: piplayer-image
          path: image-builder/work/deploy/*
